    <text x="387" y="154" text-anchor="middle">77 PB almacenados</text>
    <text x="387" y="174" text-anchor="middle">58 TB nuevos al día</text>
    <rect x="510" y="102" width="215" height="90" rx="8" fill="#fff" stroke="#3b6fd8"/>
    <text x="617" y="132" text-anchor="middle" font-weight="bold">Inteligencia artificial</text>
    <text x="617" y="154" text-anchor="middle">visión artificial,</text>
    <text x="617" y="174" text-anchor="middle">clasificación de defectos</text>
    <rect x="740" y="102" width="215" height="90" rx="8" fill="#fff" stroke="#3b6fd8"/>
    <text x="847" y="132" text-anchor="middle" font-weight="bold">Gemelos digitales</text>
    <text x="847" y="154" text-anchor="middle">simulación de la fab</text>
