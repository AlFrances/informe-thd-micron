<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Integración IT-OT en Micron: la fábrica inteligente</text>
  <rect x="30" y="60" width="940" height="150" rx="12" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="2"/>
  <text x="50" y="88" font-size="17" font-weight="bold" fill="#1e3a8a">IT · Sistemas de información</text>
  <g font-size="14" fill="#1f2937">
    <rect x="50" y="102" width="215" height="90" rx="8" fill="#fff" stroke="#3b6fd8"/>
