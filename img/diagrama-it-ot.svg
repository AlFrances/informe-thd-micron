    <text x="157" y="444" text-anchor="middle">30-40 fotos</text>
    <text x="157" y="464" text-anchor="middle">por oblea</text>
    <rect x="280" y="392" width="215" height="90" rx="8" fill="#fff" stroke="#2f9e5a"/>
