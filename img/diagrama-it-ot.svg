  </g>
  <rect x="240" y="245" width="520" height="70" rx="35" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="500" y="275" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">IIoT: más de 590.000 fuentes de datos</text>
  <text x="500" y="298" text-anchor="middle" font-size="14" fill="#92400e">cámaras · micrófonos · sensores de temperatura y humedad</text>
  <g stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <line x1="460" y1="318" x2="460" y2="347"/>
    <line x1="460" y1="212" x2="460" y2="241"/>
    <line x1="540" y1="241" x2="540" y2="212"/>
    <line x1="540" y1="347" x2="540" y2="318"/>
  </g>
  <text x="560" y="232" font-size="12" fill="#6b7280">datos</text>
  <text x="390" y="232" font-size="12" fill="#6b7280">alertas</text>
  <text x="560" y="338" font-size="12" fill="#6b7280">datos</text>
  <text x="380" y="338" font-size="12" fill="#6b7280">órdenes</text>
  <rect x="30" y="350" width="940" height="150" rx="12" fill="#e7f6ec" stroke="#2f9e5a" stroke-width="2"/>
  <text x="50" y="378" font-size="17" font-weight="bold" fill="#14532d">OT · Fabricación física de chips</text>
  <g font-size="14" fill="#1f2937">
    <rect x="50" y="392" width="215" height="90" rx="8" fill="#fff" stroke="#2f9e5a"/>
