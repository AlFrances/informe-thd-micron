    <text x="387" y="444" text-anchor="middle">transporte automático</text>
    <text x="387" y="464" text-anchor="middle">de obleas</text>
    <rect x="510" y="392" width="215" height="90" rx="8" fill="#fff" stroke="#2f9e5a"/>
